# Análisis de SonarQube para el frontend de TecniServicios.
# Ejecutar: `pnpm test:coverage` (genera coverage/lcov.info) y luego `pnpm sonar`
# con SONAR_HOST_URL y SONAR_TOKEN definidos en el entorno.

sonar.projectKey=admin-tecni-servicios-frontend
sonar.projectName=Admin TecniServicios - Frontend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src,e2e,test
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,e2e/**/*.ts,test/**/*.ts,test/**/*.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/__snapshots__/**

# Cobertura generada por Vitest (@vitest/coverage-v8)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json

# Tipos y declaraciones: no contienen lógica ejecutable.
sonar.coverage.exclusions=src/types/**,src/**/*.d.ts

# Catálogos estáticos (listas de municipios y países): datos, no lógica.
sonar.cpd.exclusions=src/services/Municipios.ts,src/services/Paises.ts,src/services/Departamentos.ts
